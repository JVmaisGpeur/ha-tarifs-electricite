previsions:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tarifs_electricite
    heures:
      required: false
      default: 24
      selector:
        number:
          min: 1
          max: 72
          unit_of_measurement: h
    duree:
      required: false
      selector:
        number:
          min: 0.25
          max: 48
          step: 0.25
          unit_of_measurement: h
